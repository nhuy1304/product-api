name: Test Product CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Check project files
        run: |
          echo "Testing Product CI pipeline..."
          node --version
          npm --version
          test -f package.json
          test -f src/app.js
          echo "Product CI test passed"